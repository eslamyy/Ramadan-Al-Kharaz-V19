
name: Build Ramadan Al Kharaz V19.4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V19.4 project
        shell: bash
        run: |
          set -e

          mkdir -p android-project

          unzip -q \
            Ramadan_Al_Kharaz_V19_4_Stock_Inventory_Upgrade.zip \
            -d android-project

          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

          echo "Project extracted successfully"

      - name: Build Android APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V19.4-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
