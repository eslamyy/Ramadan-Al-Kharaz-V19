
name: Build Ramadan Al Kharaz V19.2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Ramadan_Al_Kharaz_V19_2_1_Compile_Fix.zip'
      - '.github/workflows/build-v19.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V19.2.1 project
        run: unzip -q Ramadan_Al_Kharaz_V19_2_1_Compile_Fix.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/Ramadan_Al_Kharaz_V18
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V19-2-1-APK
          path: extracted/Ramadan_Al_Kharaz_V18/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  
