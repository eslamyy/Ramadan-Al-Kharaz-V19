
name: Build Ramadan Al Kharaz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build Android project
        shell: bash
        run: |
          set -e
          PROJECT=$(find . -type f -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found."
            exit 1
          fi

          cd "$(dirname "$PROJECT")"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find app/build/outputs/apk -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-APK
          path: apk-output/*.apk
          if-no-files-found: error
