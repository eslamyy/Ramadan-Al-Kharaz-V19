name: Build Ramadan Al Kharaz V19 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Ramadan_Al_Kharaz_V19_Invoice_Logo_Stamp.zip'
      - '.github/workflows/build-v19.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project
        run: unzip -q Ramadan_Al_Kharaz_V19_Invoice_Logo_Stamp.zip -d extracted
      - name: Build debug APK
        working-directory: extracted/Ramadan_Al_Kharaz_V18
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V19-APK
          path: extracted/Ramadan_Al_Kharaz_V18/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
